name: Refresh public GAC defense catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-gac-defense-catalog-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate catalogue parser
        run: python -m unittest tests.test_gac_catalog -v
      - name: Collect public SWGOH.GG defensive teams
        run: python scripts/update_gac_catalog.py
      - name: Validate collected catalogue
        run: |
          test -s blue-gac/gac-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("blue-gac/gac-catalog.json").read_text(encoding="utf-8"))
          assert data.get("schemaVersion") == 1
          assert isinstance(data.get("teams"), list) and data["teams"]
          assert all(len(team.get("members", [])) in (3, 5) for team in data["teams"])
          print("Validated", len(data["teams"]), "complete defensive compositions")
          PY
      - name: Upload defensive catalogue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: defensive-gac-catalogue
          path: blue-gac/gac-catalog.json
          if-no-files-found: error

  publish:
    needs: collect
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Download defensive catalogue
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: defensive-gac-catalogue
          path: ./gac-artifacts
      - name: Validate and publish defensive catalogue
        run: |
          test -s gac-artifacts/gac-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("gac-artifacts/gac-catalog.json").read_text(encoding="utf-8"))
          assert data.get("schemaVersion") == 1
          assert isinstance(data.get("teams"), list) and data["teams"]
          assert all(len(team.get("members", [])) in (3, 5) for team in data["teams"])
          PY
          cp gac-artifacts/gac-catalog.json blue-gac/gac-catalog.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add blue-gac/gac-catalog.json
          if git diff --cached --quiet -- blue-gac/gac-catalog.json; then
            echo "GAC defensive catalogue is already up to date."
          else
            git commit -m "chore(gac): refresh public defensive team catalogue"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
