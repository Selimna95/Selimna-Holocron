name: Deploy GitHub Pages after quality

on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact commit that passed quality checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Jekyll's container leaves _site owned by root. Pre-create the generated
      # data directory for the runner so the Node builder can write into it.
      - name: Prepare writable Crinolo data directory
        run: sudo install -d -m 755 -o "$(id -u)" -g "$(id -g)" ./_site/statCalcData

      - name: Build Crinolo game data
        run: node scripts/build-crinolo-gamedata.mjs ./_site/statCalcData/gameData.json

      - name: Build exact Optimizer progression variants
        run: node scripts/build-optimizer-profile-variants.mjs python/optimizer_profiles.json ./_site/statCalcData/gameData.json ./_site/statCalcData/optimizer_profiles.v2.json ./_site/statCalcData/optimizer_profile_coverage.json

      - name: Upload the tested site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./_site

      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
