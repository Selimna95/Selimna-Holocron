name: Refresh GAC usage database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths:
      - "gac-browser-export.json"
      - "scripts/update_gac_usage.py"
      - "tests/test_gac_usage.py"
      - ".github/workflows/refresh-gac-catalog.yml"

permissions:
  contents: read

concurrency:
  group: import-gac-data-main
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test GAC parsers and importer
        run: python tests/test_gac_usage.py
      - name: Refresh from live SWGOH.GG, browser export or last-known-good snapshot
        run: python scripts/update_gac_usage.py
      - name: Report published source health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("gac-usage.json").read_text(encoding="utf-8"))
          count = sum(len(season.get("characters", {})) for season in data.get("seasons", []))
          print("GAC source status:", data.get("sourceStatus", "unavailable"))
          print("Evidence type:", data.get("evidenceType", "unknown"))
          print("Updated:", data.get("updatedAt"))
          print("Character records:", count)
          if data.get("sourceStatus") == "observed":
              assert count > 0, "Observed GAC source cannot have an empty character dataset"
          PY
      - name: Upload generated GAC snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gac-usage-snapshots
          path: |
            gac-usage.json
            gac-usage.js
          if-no-files-found: error

  publish:
    needs: import
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Download generated GAC snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gac-usage-snapshots
          path: ./gac-artifacts
      - name: Validate and publish snapshots
        run: |
          test -s gac-artifacts/gac-usage.json
          test -s gac-artifacts/gac-usage.js
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("gac-artifacts/gac-usage.json").read_text(encoding="utf-8"))
          count = sum(len(season.get("characters", {})) for season in data.get("seasons", []))
          if data.get("sourceStatus") == "observed":
              assert count > 0, "Observed GAC source cannot have an empty character dataset"
          PY
          cp gac-artifacts/gac-usage.json gac-usage.json
          cp gac-artifacts/gac-usage.js gac-usage.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          if git diff --quiet -- gac-usage.json gac-usage.js; then
            echo "GAC usage snapshots are already up to date."
          else
            git add gac-usage.json gac-usage.js
            git commit -m "chore(gac): import browser-collected usage data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
