name: Import GAC data

on:
  workflow_dispatch:
  push:
    paths:
      - "gac-browser-export.json"
      - "scripts/update_gac_usage.py"
      - "tests/test_gac_usage.py"
      - ".github/workflows/refresh-gac-catalog.yml"

permissions:
  contents: write

concurrency:
  group: import-gac-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test GAC parsers and importer
        run: python tests/test_gac_usage.py
      - name: Require a browser-collected export
        run: |
          test -s gac-browser-export.json || {
            echo "::error::Add gac-browser-export.json from the SWGOH.GG browser collector to the repository root."
            exit 1
          }
      - name: Build and validate GAC usage database
        run: python scripts/update_gac_usage.py
      - name: Publish generated usage snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- gac-usage.json gac-usage.js; then
            echo "GAC usage snapshots are already up to date."
          else
            git add gac-usage.json gac-usage.js
            git commit -m "chore(gac): import browser-collected usage data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
