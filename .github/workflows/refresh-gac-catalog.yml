name: Refresh GAC data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_gac_catalog.py"
      - "scripts/update_gac_usage.py"
      - "tests/test_gac_usage.py"
      - ".github/workflows/refresh-gac-catalog.yml"

permissions:
  contents: write

concurrency:
  group: refresh-gac-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test GAC usage parser
        run: python -m unittest tests/test_gac_usage.py -v
      - name: Fetch and validate defensive catalogue
        run: python scripts/update_gac_catalog.py
      - name: Build character and fleet usage database
        run: python scripts/update_gac_usage.py
      - name: Publish changed GAC snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- blue-gac/gac-catalog.json gac-usage.json gac-usage.js; then
            echo "GAC datasets are already up to date."
          else
            git add blue-gac/gac-catalog.json gac-usage.json gac-usage.js
            git commit -m "chore(gac): refresh defensive and usage datasets"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
