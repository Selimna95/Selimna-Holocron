name: Refresh GAC usage database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    paths:
      - "gac-browser-export.json"
      - "scripts/update_gac_usage.py"
      - "tests/test_gac_usage.py"
      - ".github/workflows/refresh-gac-catalog.yml"
      - "gac-usage.json"
      - "gac-usage.js"

permissions:
  contents: write

concurrency:
  group: import-gac-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test GAC parsers and importer
        run: python tests/test_gac_usage.py
      - name: Refresh from live SWGOH.GG, browser export or last-known-good snapshot
        run: python scripts/update_gac_usage.py
      - name: Report published source health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("gac-usage.json").read_text(encoding="utf-8"))
          count = sum(len(season.get("characters", {})) for season in data.get("seasons", []))
          print("GAC source status:", data.get("sourceStatus", "unavailable"))
          print("Evidence type:", data.get("evidenceType", "unknown"))
          print("Updated:", data.get("updatedAt"))
          print("Character records:", count)
          if data.get("sourceStatus") == "observed":
              assert count > 0, "Observed GAC source cannot have an empty character dataset"
          PY
      - name: Publish generated usage snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- gac-usage.json gac-usage.js; then
            echo "GAC usage snapshots are already up to date."
          else
            git add gac-usage.json gac-usage.js
            git commit -m "chore(gac): import browser-collected usage data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
