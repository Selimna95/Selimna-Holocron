name: Review gate

on:
  # A review cannot exist yet when a PR is opened or synchronized.
  # Run only after a review event; a new head SHA remains blocked until it is reviewed.
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require an automated review of the current PR head
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed("Impossible d'identifier la Pull Request à contrôler.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });

            const hasIndependentApproval = reviews.some(review =>
              review.user?.login &&
              review.user.login !== pr.user?.login &&
              review.commit_id === pr.head.sha &&
              review.state === "APPROVED"
            );

            if (!hasIndependentApproval) {
              core.setFailed(
                "Une approbation humaine indépendante est obligatoire sur le SHA actuel " +
                "de la PR. L'auteur de la PR ne peut pas approuver sa propre modification."
              );
            } else {
              core.info("Approbation indépendante trouvée sur le SHA actuel : " + pr.head.sha);
            }
