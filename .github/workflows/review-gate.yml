name: Review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR metadata and patch hygiene
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.setFailed("Impossible d'identifier la Pull Request à contrôler.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });

            if (pr.base.ref !== "main" || pr.head.ref === "main") {
              core.setFailed("La PR doit cibler main depuis une branche de travail distincte.");
              return;
            }
            if (!pr.title?.trim() || (pr.body || "").trim().length < 30) {
              core.setFailed("La PR doit avoir un titre et une description suffisamment explicites.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100
            });

            const problems = [];
            for (const file of files) {
              if (typeof file.patch !== "string") continue;
              for (const line of file.patch.split("\n")) {
                if (!line.startsWith("+") || line.startsWith("+++")) continue;
                const added = line.slice(1);
                if (/[\\t ]$/.test(added)) {
                  problems.push(file.filename + ": espace final dans une ligne ajoutée");
                }
                if (/^(<<<<<<< |>>>>>>> )/.test(added)) {
                  problems.push(file.filename + ": marqueur de conflit Git ajouté");
                }
              }
            }

            if (problems.length) {
              core.setFailed("Contrôle automatique de la PR en échec :\n" + problems.join("\n"));
            } else {
              core.info("Contrôles automatiques de PR réussis : cible, description, hygiène du diff (" + files.length + " fichiers).");
            }
