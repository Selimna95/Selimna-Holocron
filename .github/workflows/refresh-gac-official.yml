name: Refresh official GAC leaderboards

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    paths:
      - "scripts/collect_comlink_gac.py"
      - ".github/workflows/refresh-gac-official.yml"

permissions:
  contents: write

concurrency:
  group: refresh-official-gac-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start temporary SWGOH Comlink service
        run: |
          docker run -d --name swgoh-comlink -p 3000:3000 -e APP_NAME="SelimnasHolocron" ghcr.io/swgoh-utils/swgoh-comlink:latest
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/api-docs >/dev/null; then
              echo "Comlink is ready."
              exit 0
            fi
            sleep 3
          done
          docker logs swgoh-comlink
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official GAC league leaderboards
        env:
          COMLINK_URL: http://127.0.0.1:3000
        run: python scripts/collect_comlink_gac.py
      - name: Publish official leaderboard snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- gac-official-leaderboards.json gac-official-leaderboards.js; then
            echo "Official GAC leaderboard snapshot is unchanged."
          else
            git add gac-official-leaderboards.json gac-official-leaderboards.js
            git commit -m "chore(gac): refresh official leaderboard snapshot"
            git pull --rebase origin "\${GITHUB_REF_NAME}"
            git push origin "HEAD:\${GITHUB_REF_NAME}"
          fi
