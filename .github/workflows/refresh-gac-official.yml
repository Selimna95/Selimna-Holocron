name: Refresh official GAC leaderboards

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/collect_comlink_gac.py"
      - ".github/workflows/refresh-gac-official.yml"

permissions:
  contents: read

concurrency:
  group: refresh-official-gac-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Start temporary SWGOH Comlink service
        run: |
          docker run -d --name swgoh-comlink -p 3000:3000 -e APP_NAME="SelimnasHolocron" ghcr.io/swgoh-utils/swgoh-comlink:latest
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
              echo "Comlink is ready."
              exit 0
            fi
            sleep 3
          done
          docker logs swgoh-comlink
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Collect official GAC league leaderboards
        env:
          COMLINK_URL: http://127.0.0.1:3000
        run: python scripts/collect_comlink_gac.py
      - name: Validate collected snapshots
        run: |
          test -s gac-official-leaderboards.json
          test -s gac-official-leaderboards.js
      - name: Upload official leaderboard snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-gac-snapshots
          path: |
            gac-official-leaderboards.json
            gac-official-leaderboards.js
          if-no-files-found: error

  publish:
    needs: collect
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Download official leaderboard snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-gac-snapshots
          path: ./gac-artifacts
      - name: Publish collected leaderboard snapshot
        run: |
          test -s gac-artifacts/gac-official-leaderboards.json
          test -s gac-artifacts/gac-official-leaderboards.js
          cp gac-artifacts/gac-official-leaderboards.json gac-official-leaderboards.json
          cp gac-artifacts/gac-official-leaderboards.js gac-official-leaderboards.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add gac-official-leaderboards.json gac-official-leaderboards.js
          if git diff --cached --quiet -- gac-official-leaderboards.json gac-official-leaderboards.js; then
            echo "Official leaderboard snapshot is unchanged."
          else
            git commit -m "chore(gac): refresh official leaderboard snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
