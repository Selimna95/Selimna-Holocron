name: Quality checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile python/optimizer.py python/kyber_data.py scripts/update_gac_catalog.py scripts/update_gac_usage.py scripts/collect_comlink_gac.py

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check interface-adapter.js
      - run: node --check modules/core.js
      - run: node --check modules/acolyte.js
      - run: node --check modules/disciple.js
      - run: node --check modules/seigneur.js
      - run: node --check modules/seigneur-gac.js
      - run: node --check modules/seigneur-impact.js
      - run: node --check tests/seigneur_impact.test.mjs
      - run: node tests/seigneur_impact.test.mjs
      - run: node tests/seigneur_gac_bridge.test.mjs
      - run: node --check modules/sithari.js
      - run: node --check modules/sithari-strategy.js
      - run: node --check modules/runtime.js
      - run: node --check optimizer-worker.mjs
      - run: node --check blue-gac/blue-gac.js
      - run: node --check tests/browser_smoke.mjs
      - run: node --check tools/gac-collector.js
      - run: node tests/mod_engine_regression.mjs
      - run: node --check blue-gac/gac-audit.js
      - run: node --check tests/gac_audit.test.mjs
      - run: node tests/gac_audit.test.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-save playwright@1.55.0
      - name: Serve the static app
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/holocron-http.log 2>&1 & echo $! > /tmp/holocron-http.pid
      - run: node tests/browser_smoke.mjs
