name: Quality checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile python/optimizer.py python/kyber_data.py scripts/update_gac_catalog.py scripts/update_gac_counters.py

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check interface-adapter.js
      - run: node --check modules/core.js
      - run: node --check modules/acolyte.js
      - run: node --check modules/disciple.js
      - run: node --check modules/seigneur.js
      - run: node --check modules/sithari.js
      - run: node --check modules/runtime.js
      - run: node --check optimizer-worker.mjs
      - run: node --check blue-gac/blue-gac.js
      - run: node --check tests/browser_smoke.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-save playwright@1.55.0
      - name: Serve the static app
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/holocron-http.log 2>&1 & echo $! > /tmp/holocron-http.pid
      - run: node tests/browser_smoke.mjs

  live-counter-validation:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'V4.2.0')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect real public SWGOH.GG counter data
        run: python scripts/update_gac_counters.py
      - name: Validate both formats and real matchup metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("blue-gac/gac-counters.json").read_text(encoding="utf-8"))
          assert data["counters"], "No counter rows were collected"
          for fmt in ("5v5", "3v3"):
              rows = [row for row in data["counters"] if row["format"] == fmt]
              assert rows, f"No real counter rows for {fmt}"
              assert all(row["attackMembers"] and row["battles"] > 0 for row in rows)
              assert all(0 <= row["winRate"] <= 100 for row in rows)
          print(f"Validated {len(data['counters'])} real counter rows.")
          print(json.dumps(data["coverage"], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gac-counters-validation
          path: blue-gac/gac-counters.json
          if-no-files-found: error
          retention-days: 7
