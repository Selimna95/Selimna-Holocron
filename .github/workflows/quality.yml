name: Quality checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile python/optimizer.py python/kyber_data.py

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check interface-adapter.js
      - run: node --check modules/core.js
      - run: node --check modules/acolyte.js
      - run: node --check modules/disciple.js
      - run: node --check modules/seigneur.js
      - run: node --check modules/sithari.js
      - run: node --check modules/runtime.js
      - run: node --check optimizer-worker.mjs
      - run: node --check tests/browser_smoke.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve the static app
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/holocron-http.log 2>&1 & echo $! > /tmp/holocron-http.pid
      - run: node tests/browser_smoke.mjs
