name: Validate public GAC counters

on:
  pull_request:
    paths:
      - "scripts/update_gac_counters.py"
      - "blue-gac/gac-counters.json"
      - "blue-gac/blue-gac.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect real public SWGOH.GG counter data
        run: python -m scripts.update_gac_counters
      - name: Validate both formats and preserve raw statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("blue-gac/gac-counters.json").read_text(encoding="utf-8"))
          assert data["counters"], "No counter rows were collected"
          for fmt in ("5v5", "3v3"):
              rows = [row for row in data["counters"] if row["format"] == fmt]
              assert rows, f"No real counter rows for {fmt}"
              assert all(row["attackMembers"] and row["battles"] > 0 for row in rows)
              assert all(0 <= row["winRate"] <= 100 for row in rows)
          print(f"Validated {len(data['counters'])} real counter rows.")
          print(json.dumps(data["coverage"], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gac-counters-validation
          path: blue-gac/gac-counters.json
          if-no-files-found: error
          retention-days: 7
